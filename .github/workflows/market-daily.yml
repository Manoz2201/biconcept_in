name: Daily market research

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install agent deps
        working-directory: tool/market_agent
        run: dart pub get

      - name: Run market agent
        working-directory: tool/market_agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: dart run bin/market_agent.dart
