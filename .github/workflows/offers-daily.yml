name: Daily studio offers

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  offers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install agent deps
        working-directory: tool/offers_agent
        run: dart pub get

      - name: Run offers agent
        working-directory: tool/offers_agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: dart run bin/offers_agent.dart
