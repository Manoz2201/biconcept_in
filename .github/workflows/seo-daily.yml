name: Daily SEO agent

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install agent deps
        working-directory: tool/seo_agent
        run: dart pub get

      - name: Run SEO agent
        working-directory: tool/seo_agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: dart run bin/seo_agent.dart --root "${{ github.workspace }}"

      - name: Gate on flutter test
        run: flutter test

      - name: Open pull request if copy changed
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: seo/daily
          delete-branch: true
          title: "seo: daily copy proposals"
          commit-message: "seo: apply daily agent proposals"
          body: |
            Daily SEO/copy agent run.

            Allowlisted files only (`assets/seo/**`, sitemap, index, `lib/content/copy.dart`).
            `flutter test` already passed on this tree; auto-merge follows.
          add-paths: |
            assets/seo/**
            web/sitemap.xml
            web/index.html
            lib/content/copy.dart

      - name: Auto-merge after tests
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash
